events {
    worker_connections 4096;
}

http {
    upstream gateway_nodes {
        # least_conn spreads load better than round-robin when request
        # costs vary (e.g. some hit Redis, some serve from local fallback).
        least_conn;
        server gateway1:8000 max_fails=3 fail_timeout=5s;
        server gateway2:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, don't append: $proxy_add_x_forwarded_for concatenates
            # onto whatever X-Forwarded-For the client already sent, so a
            # client sending its own XFF value put that value FIRST in the
            # resulting header - and the gateway (identify_caller()) reads
            # the first entry, making it attacker-controlled. Since Nginx is
            # the single trusted edge here, $remote_addr is the only value
            # that should ever reach the gateway in this header.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_connect_timeout 2s;
        }
    }
}
