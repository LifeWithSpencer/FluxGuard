services:
  redis:
    image: redis:7.4-alpine
    # requirepass: without it, anything that can reach this port can read/
    # write rate-limit state, run arbitrary EVAL, or flush the script cache -
    # full compromise of the enforcement layer. ${REDIS_PASSWORD:?...} fails
    # the compose run loudly if it's unset, instead of quietly booting an
    # unauthenticated Redis.
    command: >
      redis-server --appendonly yes --save 60 1
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in a local .env file, do not hardcode}
    # No top-level `ports:` mapping - Redis should only be reachable from
    # other containers on this compose network, never from the host/internet.
    # `expose` documents the port to other services without publishing it.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in a local .env file, do not hardcode}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  upstream:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "mock_upstream:app", "--host", "0.0.0.0", "--port", "9000", "--loop", "uvloop"]
    expose:
      - "9000"

  gateway1:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      gunicorn main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 30
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in a local .env file, do not hardcode}@redis:6379/0
      UPSTREAM_URL: http://upstream:9000
    depends_on:
      redis:
        condition: service_healthy
      upstream:
        condition: service_started
    expose:
      - "8000"

  gateway2:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      gunicorn main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 30
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in a local .env file, do not hardcode}@redis:6379/0
      UPSTREAM_URL: http://upstream:9000
    depends_on:
      redis:
        condition: service_healthy
      upstream:
        condition: service_started
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - gateway1
      - gateway2

volumes:
  redis-data:
